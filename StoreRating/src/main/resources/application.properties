spring.application.name=StoreRating
# ======================================
# SERVER CONFIG
# ======================================
server.port=8081

# ======================================
# DATABASE - PostgreSQL
# ======================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ratingApp_db
spring.datasource.username=postgres
spring.datasource.password=2654

spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# JPA / HIBERNATE
# ======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Choose DB dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======================================
# MULTIPART (Image/File Upload)
# ======================================
# Enable file upload
spring.servlet.multipart.enabled=true

# Max file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Folder where images will be saved (custom folder)
file.upload-dir=uploads/

# ======================================
# SWAGGER / OPENAPI (If using springdoc)
# ======================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ======================================
# SPRING SECURITY (BASIC SETTINGS)
# ======================================
spring.security.filter.dispatcher-types=ASYNC,REQUEST,ERROR

# Disable default security login page (optional)
spring.security.user.name=don
spring.security.user.password=don

# ======================================
# JWT CONFIG
# ======================================
app.jwt.secret=sanket
app.jwt.expiration=864000   # 24 hours in milliseconds (1000 * 60 * 60 * 24)

# Refresh token (optional)
app.jwt.refresh-expiration=6048000   # 7 days

# ======================================
# CORS SETTINGS
# ======================================
# Allow frontend to access backend APIs
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true

