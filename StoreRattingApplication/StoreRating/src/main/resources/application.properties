spring.application.name=StoreRating

# ======================================
# SERVER
# ======================================
server.port=8888

# ======================================
# DATABASE - MYSQL
# ======================================
#spring.datasource.url=jdbc:mysql://localhost:3306/ratingApp_db?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/ratingApp_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================================
# JPA / HIBERNATE
# ======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================================
# SPRING BATCH (IMPORTANT FOR CSV)
# ======================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ======================================
# FILE UPLOAD
# ======================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

file.upload-dir=uploads/

# ======================================
# SWAGGER
# ======================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ======================================
# SECURITY (REMOVE DEFAULT USER)
# ======================================
# DELETE THESE IN PRODUCTION
# spring.security.user.name=don
# spring.security.user.password=don

# ======================================
# JWT
# ======================================
jwt.secret=AWiua9u41jKOaQy7aB4hLJ2YCvQPFsP5hzT/26C2/II=
jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ======================================
# CORS
# ======================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true