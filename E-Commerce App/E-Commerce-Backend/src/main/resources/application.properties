spring.application.name=E-Commerce-Backend


# Server port
server.port=8081

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**


# Maximum file size for a single file upload (default is 1MB)
spring.servlet.multipart.max-file-size=50MB

# Maximum request size for a multipart request (default is 10MB)
spring.servlet.multipart.max-request-size=50MB

# Optional: Set the maximum size of a non-multipart POST request
server.tomcat.max-http-post-size=50MB


