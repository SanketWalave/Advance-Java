spring.application.name=SpringSecurity

# ======================================
# SERVER CONFIG
# ======================================
server.port=8000

# ======================================
# DATABASE - MySQL (FIXED)
# ======================================
spring.datasource.url=jdbc:mysql://localhost:3306/security_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======================================
# JPA / HIBERNATE
# ======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ? dialect REMOVED (Hibernate 7 auto-detects)

# ======================================
# MULTIPART
# ======================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=uploads/

# ======================================
# SWAGGER / OPENAPI
# ======================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ======================================
# SPRING SECURITY
# ======================================
spring.security.filter.dispatcher-types=ASYNC,REQUEST,ERROR
spring.security.user.name=don
spring.security.user.password=don

# ======================================
# JWT
# ======================================
app.jwt.secret=sanket
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ======================================
# CORS
# ======================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true
